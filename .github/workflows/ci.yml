name: Esteira CI/CD Python baseada em GitHub Actions
on:
  push:
    branches: [feature/esteira, main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: flake8 - Linting
        run: |
          python -m flake8 app

      - name: Pytest - Run tests
        run: |
            python -m pytest tests   
            
      - name: bandit - Security checks
        run: |
          python -m bandit -r app

      - name: mypy - Type checking
        run: |
            python -m mypy app      
      - name: radon 
        run: |
            python -m radon cc app -a
# Etapa VI: Geração e Entrega de Artefatos
      - name: Run Pipeline Script
        run: |
          mkdir -p output
          python app/pipeline.py
        # Nota: Certifique-se de que seu pipeline.py use caminhos relativos 
        # ou que você passe os argumentos de entrada/saída aqui.

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: summary-report
          path: output/summary.csv

# Etapa VII: Promoção e Entrega Contínua (CD)
  deploy:
    name: Deploy
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Só executa se for na branch main
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: summary-report

      - name: Execute Deploy
        run: |
          echo "Artefato validado com sucesso."
          echo "Iniciando promoção para o ambiente de produção..."